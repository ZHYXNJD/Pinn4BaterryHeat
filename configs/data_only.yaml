# 阶段 1：纯数据探路
# 目的：找到适合 data loss 的超参（lr、batch 等），收敛到较小 loss。
# 策略：与 PINN 使用相同架构和输出格式，确保超参可迁移到阶段 2。
# 阶段 2：固定 data 相关超参，加入物理损失，调物理权重等。
#
# 若 output_temp_scale=0 时 loss 不收敛（预测塌缩），可尝试 output_temp_scale: 10.0，
# 此时 lr 需重新探路，且迁移到 PINN 时需微调。

geometry:
  length_x_mm: 66.0
  length_y_mm: 141.0
  length_z_mm: 218.0
  cells_x: 8
  cells_y: 1
  cold_plate_face: z_min

physics:
  rho: 3000.0
  cp: 1100.0
  k: 2.73
  k_x: 2.73
  k_y: 0.91
  k_z: 2.73
  t_max: 1800.0
  init_temp: 313.15
  output_temp_scale: 0.0    # 0：与 PINN 一致，模型直接预测 Kelvin 偏移，超参可迁移
  cooling_region_weight: 20.0   # 冷却区 z<-50mm 样本权重，与 time_embed 配合使用
  cooling_z_threshold_mm: -50.0

fluid:
  thickness_mm: 4.0
  rho: 1261.0
  cp: 1370.0
  k: 0.0876
  vel_m_s: 1.9
  flow_dir: x
  inlet_temp: 283.15
  channel_count: 7
  channel_pitch_mm: 18.0
  channel_width_mm: 10.0
  channel_axis: y

plate:
  thickness_mm: 4.0
  rho: 2719.0
  cp: 871.0
  k: 202.4

phase_change:
  enabled: false
  latent_heat: 190740.0
  melting_temp: 283.15
  transition_width: 2.0
  pcm_region: plate

# 与 PINN（如 refactor_weights_scheme_d）保持相同架构，便于超参迁移
model:
  hidden_layers: [128, 128, 128]
  activation: sine          # SIREN，与 PINN 一致
  fourier_features: 4
  fourier_sigma: 1.5
  max_q_terms: 7
  time_embed_freqs: 8       # 显式 sin/cos 时间编码，解决模型无法学习 T(t) 的问题

# 探路超参：调整至 data loss 收敛到较小值，再用于 PINN
optim:
  data_only: true
  lr: 1.0e-3
  epochs: 100              # 足够轮数观察收敛
  batch_data: 64           # 与 PINN 一致
  keep_best_n: 5
  save_interval: 100
  print_every: 10
  plot_every: 200
  grad_clip: 1.0
  lr_patience: 0

visualization:
  x_slices_mm: [33.0, 132.0, 264.0, 396.0]
  heatmap_time_points: [300.0, 600.0, 900.0, 1200.0, 1500.0, 1800.0]

conditions:
  - name: base_0p5C
    q_poly: [34015.27968, -1.78702E+01, 4.81106E-02, -4.54327E-05, 1.45427E-08]
    t_env: 313.15
    h_coeff: 800.0
    inlet_temp: 283.15
    train_interior: 'sample_data/battery_train_dataset.csv'
    train_boundary: null
    test: 'sample_data/battery_test_dataset.csv'

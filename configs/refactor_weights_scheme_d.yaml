# 方案 C：无 freeze，仅 warmup
# 所有 loss 从 epoch 1 参与，适度 warmup，中等权重

# 可以完美运行的版本

geometry:
  length_x_mm: 66.0
  length_y_mm: 141.0
  length_z_mm: 218.0
  cells_x: 8
  cells_y: 1
  cold_plate_face: z_min

physics:
  rho: 3000.0
  cp: 1100.0
  k: 2.73
  k_x: 2.73
  k_y: 0.91
  k_z: 2.73
  t_max: 3600.0 # {2c40:1800, 1c40:3600,1.5c40:2400,1.5c25:2400}
  init_temp: 313.15
  cooling_region_weight: 20.0   # 冷却区样本权重，缓解无法学到温度下降
  cooling_z_threshold_mm: -50.0

  bc_weight: 1.0
  bc_warmup_epochs: 800
  bc_freeze_epochs: 0
#  bc_temp_scale: 10.0
  bc_temp_scale: 1.0

  # 方案 C：无 freeze，cold_bc 权重 1e-4
  cold_bc_weight: 1
  cold_bc_freeze_epochs: 0
  cold_bc_warmup_epochs: 1
#  cold_bc_temp_scale: 10.0
  cold_bc_temp_scale: 1.0

  data_weight: 1.0
  residual_weight: 1.0
  ic_weight: 1.0
#  q_scale: 0.3
# 计算q值的系数 为什么有个缩放？
  q_scale: 1.0
  h_env: 12.0

  # 方案 C：interface 无 freeze，权重 0.02
  interface_weight: 1
  interface_freeze_epochs: 0
  interface_warmup_epochs: 1000
  # 不缩放
#  interface_temp_scale: 5.0
  interface_temp_scale: 1.0
#  interface_flux_scale: 1.0e5
  interface_flux_scale: 1.0

  fluid_residual_weight: 1.0
  fluid_residual_freeze_epochs: 0
  fluid_residual_warmup_epochs: 0

  fluid_inlet_weight: 1.0
  fluid_inlet_freeze_epochs: 0
  fluid_inlet_warmup_epochs: 0

  # 为社么又有个smooth weight？
#  smooth_weight: 1.0e-4
  smooth_weight: 0.0

fluid:
  thickness_mm: 4.0
  rho: 1261.0
  cp: 1370.0
  k: 0.0876
  vel_m_s: 1.9
  flow_dir: x
  inlet_temp: 283.15
  channel_count: 7
  channel_pitch_mm: 18.0
  channel_width_mm: 10.0
  channel_axis: y

plate:
  thickness_mm: 4.0
#  thickness_mm: 0.0
  rho: 2719.0
  cp: 871.0
  k: 202.4

phase_change:
  enabled: True
  latent_heat: 190740.0
  melting_temp: 283.15
  transition_width: 2.0
  pcm_region: plate

model:
  hidden_layers: [128, 128, 128]
  activation: sine
  fourier_features: 4
  fourier_sigma: 1.5
  max_q_terms: 7
  time_embed_freqs: 8       # 显式时间编码，便于学习 T(t)

# 建议：先用 data_only 探路得到 lr、batch_data，再在此基础上调物理权重
optim:
  lr: 5.0e-3              # 可与 data_only 探路得到的 lr 对比，必要时沿用
  epochs: 20
  batch_data: 128         # 应与 data_only 一致
  batch_residual: 128
  batch_boundary: 128
  batch_initial: 64
  print_every: 10
  plot_every: 50
  grad_clip: 1.0
  lr_patience: 5
  lr_decay: 0.5
  lr_min: 1.0e-5
  max_steps_per_epoch: 7000
  adaptive_loss_weights: True

# 评估热力图截面配置 (x 位置 mm, 时间点 s)
visualization:
  x_slices_mm: [33.0, 132.0, 264.0, 396.0]   # 多个 x 截面位置
#  heatmap_time_points: [300.0, 600.0, 900.0, 1200.0, 1500.0, 1800.0] # 2c40
  heatmap_time_points: [600.0, 1200.0, 1800.0, 2400.0, 3000.0, 3600.0]  # 1c40
#  heatmap_time_points: [400.0, 800.0, 1200.0, 1600.0, 2000.0, 2400.0] # 1.5c40
#  heatmap_time_points: [400.0, 800.0, 1200.0, 1600.0, 2000.0, 2400.0] # 1.5c25

conditions:
  - name: 1c40
#    q_poly: [34015.27968, -1.78702E+01, 4.81106E-02, -4.54327E-05, 1.45427E-08] # 2c40
    q_poly: [11914.00389,-2.27624E+00,3.76438E-03,-2.22995E-06,4.68371E-10] # 1c40
#    q_poly: [21848.38947,-1.00520E+01,2.70622E-02,-2.55559E-05,8.18028E-09 ] # 1.5c40
#    q_poly: [21154.84461,,-1.00520E+01,2.70622E-02,-2.55559E-05,8.18028E-09] # 1.5c25
    t_env: 313.15
    h_coeff: 800.0
    inlet_temp: 283.15
    train_interior: 'sample_data/battery_train_dataset_1C40.csv'
    train_boundary: None
    test: 'sample_data/battery_test_dataset_1C40.csv'

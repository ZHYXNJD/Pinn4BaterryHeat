geometry:
  length_x_mm: 66.0      # 单电芯长度(mm)
  length_y_mm: 141.0     # 单电芯宽度/厚度(mm)
  length_z_mm: 218.0     # 单电芯高度(mm)
  cells_x: 8             # 1×8布局，x方向8个 (总长 528mm)
  cells_y: 1             # 1×8布局，y方向1个 (总宽 141mm)
  cold_plate_face: z_min # 底面连接冷板

physics:
  # 电池内核物性参数 (来自文档表2)
  rho: 3000.0            # 密度 kg/m³
  cp: 1100.0             # 比热容 J/(kg·K)
  k: 2.73                # 各向同性热导率备用值 W/(m·K)
  k_x: 2.73              # x方向热导率 W/(m·K)
  k_y: 0.91              # y方向热导率 W/(m·K)
  k_z: 2.73              # z方向热导率 W/(m·K)

  # 时间与初始条件
  t_max: 1800.0          # 模拟时长 (s) 随着放电倍率而改变 (30min)
  init_temp: 313.15      # 初始温度 (K) = 40°C

  # 边界条件权重
  bc_weight: 1.0
  bc_warmup_epochs: 800
  bc_freeze_epochs: 0
  bc_temp_scale: 10.0

  # 冷板侧边界条件
  cold_bc_weight: 1.0e-7
  cold_bc_freeze_epochs: 1500
  cold_bc_warmup_epochs: 3000
  cold_bc_temp_scale: 10.0

  # 残差与初始条件权重
  data_weight: 1.0
  residual_weight: 1.0
  ic_weight: 1.0
  q_scale: 0.3           # 生热率缩放系数 (数值稳定性调节，配合q_poly使用)
  h_env: 12.0            # 环境对流系数 W/(m²·K) (自然对流/静止空气)

  # 界面耦合
  interface_weight: 0.01
  interface_freeze_epochs: 2000
  interface_warmup_epochs: 2000
  interface_temp_scale: 5.0
  interface_flux_scale: 1.0e5

  # 流体残差 (当前禁用)
  fluid_residual_weight: 0.0
  fluid_residual_freeze_epochs: 0
  fluid_residual_warmup_epochs: 0
  fluid_inlet_weight: 0.0
  fluid_inlet_freeze_epochs: 0
  fluid_inlet_warmup_epochs: 0

  # 平滑正则化
  smooth_weight: 1.0e-4

# R134a制冷剂参数 (蒸发温度10°C, 液态, 来自文档表4)
fluid:
  thickness_mm: 4.0      # 流道厚度
  rho: 1261.0            # 密度 kg/m³
  cp: 1370.0             # 比热容 J/(kg·K) = 1.3704 kJ/(kg·K)
  k: 0.0876              # 热导率 W/(m·K) = 87.618 mW/(m·K)
  vel_m_s: 1.9           # 流速 m/s
  flow_dir: x            # 流动方向 (沿x轴 528mm方向流动)
  inlet_temp: 283.15     # 入口温度 (K) = 10°C
  channel_count: 7       # 通道数
  channel_pitch_mm: 18.0 # 通道间距
  channel_width_mm: 10.0 # 通道宽度
  channel_axis: y        # 通道分布轴 (沿y轴 141mm方向分布，占用约118mm < 141mm)

# 冷板参数 (铝, 来自文档表2)
plate:
  thickness_mm: 4.0
  rho: 2719.0            # 密度 kg/m³
  cp: 871.0              # 比热容 J/(kg·K)
  k: 202.4               # 热导率 W/(m·K)

# 相变材料配置 (焓法)
phase_change:
  enabled: false          # true: 启用相变, false: 禁用
  latent_heat: 190740.0   # 相变潜热 J/kg (190.74 kJ/kg)
  melting_temp: 283.15    # 相变温度 T_m (K) = 10°C (蒸发温度)
  transition_width: 2.0   # 相变过渡区宽度 δ(K)
  pcm_region: plate       # 相变材料位置: battery/plate

# 神经网络模型配置
model:
  # 轻量化网络配置，减少参数量以降低显存占用
  hidden_layers: [128, 128, 128]
  activation: sine
  fourier_features: 4
  fourier_sigma: 1.5
  max_q_terms: 7

# 优化器配置
optim:
  # 稍大的学习率配合较短训练轮数
  lr: 5.0e-4
  epochs: 3000
  batch_data: 128
  # 轻量化批大小，降低每步计算量
  batch_residual: 128
  batch_boundary: 128
  batch_initial: 64
  print_every: 50
  plot_every: 500
  grad_clip: 1.0
  lr_patience: 200
  lr_decay: 0.5
  lr_min: 1.0e-5
  max_steps_per_epoch: 100

# 工况条件
conditions:
  - name: base_0p5C
    # 生热率多项式 W/m³ (2C40工况)
    q_poly: [34015.27968, -1.78702E+01, 4.81106E-02, -4.54327E-05, 1.45427E-08]
    t_env: 313.15         # 环境温度 (K) = 40°C
    h_coeff: 800.0        # 对流换热系数 W/(m²·K)
    inlet_temp: 283.15    # 冷却液入口温度 (K) = 10°C (与 fluid.inlet_temp 一致)
    # 训练/测试数据路径（相对于项目根目录）
    train_interior: 'sample_data/battery_train_interior_dataset.csv'
    train_boundary: 'sample_data/battery_train_boundary_dataset.csv'
    test: 'sample_data/battery_test_dataset.csv'

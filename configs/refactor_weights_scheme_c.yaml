# 方案 C：无 freeze，仅 warmup
# 所有 loss 从 epoch 1 参与，适度 warmup，中等权重

geometry:
  length_x_mm: 66.0
  length_y_mm: 141.0
  length_z_mm: 218.0
  cells_x: 8
  cells_y: 1
  cold_plate_face: z_min

physics:
  rho: 3000.0
  cp: 1100.0
  k: 2.73
  k_x: 2.73
  k_y: 0.91
  k_z: 2.73
  t_max: 1800.0
  init_temp: 313.15

  bc_weight: 1.0
  bc_warmup_epochs: 800
  bc_freeze_epochs: 0
  bc_temp_scale: 10.0

  # 方案 C：无 freeze，cold_bc 权重 1e-4
  cold_bc_weight: 1.0e-4
  cold_bc_freeze_epochs: 0
  cold_bc_warmup_epochs: 1000
  cold_bc_temp_scale: 10.0

  data_weight: 1.0
  residual_weight: 1.0
  ic_weight: 1.0
  q_scale: 0.3
  h_env: 12.0

  # 方案 C：interface 无 freeze，权重 0.02
  interface_weight: 0.02
  interface_freeze_epochs: 0
  interface_warmup_epochs: 1000
  interface_temp_scale: 5.0
  interface_flux_scale: 1.0e5

  fluid_residual_weight: 0.0
  fluid_residual_freeze_epochs: 0
  fluid_residual_warmup_epochs: 0
  fluid_inlet_weight: 0.0
  fluid_inlet_freeze_epochs: 0
  fluid_inlet_warmup_epochs: 0

  smooth_weight: 1.0e-4

fluid:
  thickness_mm: 4.0
  rho: 1261.0
  cp: 1370.0
  k: 0.0876
  vel_m_s: 1.9
  flow_dir: x
  inlet_temp: 283.15
  channel_count: 7
  channel_pitch_mm: 18.0
  channel_width_mm: 10.0
  channel_axis: y

plate:
  thickness_mm: 4.0
  rho: 2719.0
  cp: 871.0
  k: 202.4

phase_change:
  enabled: false
  latent_heat: 190740.0
  melting_temp: 283.15
  transition_width: 2.0
  pcm_region: plate

model:
  hidden_layers: [128, 128, 128]
  activation: sine
  fourier_features: 4
  fourier_sigma: 1.5
  max_q_terms: 7

optim:
  lr: 5.0e-4
  epochs: 3000
  batch_data: 128
  batch_residual: 128
  batch_boundary: 128
  batch_initial: 64
  print_every: 50
  plot_every: 500
  grad_clip: 1.0
  lr_patience: 200
  lr_decay: 0.5
  lr_min: 1.0e-5
  max_steps_per_epoch: 100

conditions:
  - name: base_0p5C
    q_poly: [34015.27968, -1.78702E+01, 4.81106E-02, -4.54327E-05, 1.45427E-08]
    t_env: 313.15
    h_coeff: 800.0
    inlet_temp: 283.15
    train_interior: 'sample_data/battery_train_interior_dataset.csv'
    train_boundary: 'sample_data/battery_train_boundary_dataset.csv'
    test: 'sample_data/battery_test_dataset.csv'
